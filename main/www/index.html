<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LED Controller</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, sans-serif;
      background: #f3f4f6;
      color: #202124;
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 20px; }
    .app {
      max-width: 620px;
      margin: 0 auto;
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 30px #0002;
      overflow: hidden;
    }
    header { padding: 20px 24px 12px; }
    h1 { margin: 0; font-size: 24px; }
    .tabs { display: flex; border-bottom: 1px solid #ddd; padding: 0 16px; }
    .tab {
      flex: 1;
      border: 0;
      border-bottom: 3px solid transparent;
      padding: 14px 8px;
      background: transparent;
      cursor: pointer;
      font-weight: 700;
    }
    .tab.active { color: #b52f3b; border-color: #db545a; }
    .panel { display: none; padding: 24px; }
    .panel.active { display: block; }
    .field { margin-bottom: 22px; }
    label { display: block; margin-bottom: 8px; font-weight: 700; }
    select, input[type="number"] {
      width: 100%;
      padding: 11px;
      border: 1px solid #aaa;
      border-radius: 8px;
      font-size: 16px;
      background: white;
    }
    input[type="range"] { width: 100%; accent-color: #db545a; }
    .value { color: #b52f3b; }
    .button {
      width: 100%;
      padding: 13px;
      border: 0;
      border-radius: 10px;
      background: #db545a;
      color: white;
      cursor: pointer;
      font-size: 16px;
      font-weight: 700;
    }
    .button.secondary { background: #555; margin-bottom: 22px; }
    .button:disabled { opacity: .55; cursor: wait; }
    .hint { margin: 8px 0 0; color: #666; font-size: 14px; }
    .status { min-height: 22px; margin: 14px 0 0; text-align: center; }
    .dirty { color: #9a5b00; }
    .error { color: #b00020; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <h1>LED Controller</h1>
    </header>

    <nav class="tabs" aria-label="Разделы настроек">
      <button class="tab active" data-panel="control">Управление</button>
      <button class="tab" data-panel="profiles">Режимы</button>
    </nav>

    <section class="panel active" id="control">
      <button class="button secondary" id="powerButton">Загрузка…</button>

      <div class="field">
        <label for="brightness">Яркость: <span class="value" id="brightnessValue">100</span>%</label>
        <input id="brightness" type="range" min="0" max="100" value="100">
      </div>

      <div class="field">
        <label for="mode">Режим</label>
        <select id="mode">
          <option value="1">Горит постоянно</option>
          <option value="2">Синхронное затухание</option>
          <option value="3">Противофазное затухание</option>
          <option value="4">Неполное противофазное затухание</option>
        </select>
        <p class="hint">Параметры выбранного режима находятся на вкладке «Режимы».</p>
      </div>
    </section>

    <section class="panel" id="profiles">
      <p class="hint" id="constantHint">У постоянного режима нет временного профиля.</p>
      <div id="animatedFields">
        <div class="field">
          <label for="fadeMs">Время плавного перехода, мс</label>
          <input id="fadeMs" type="number" min="100" max="30000" step="100">
        </div>
        <div class="field">
          <label for="pauseMs">Пауза, мс</label>
          <input id="pauseMs" type="number" min="0" max="30000" step="100">
        </div>
        <div class="field hidden" id="lowerField">
          <label for="lowerBrightness">Нижняя яркость: <span class="value" id="lowerValue">15</span>%</label>
          <input id="lowerBrightness" type="range" min="0" max="100" value="15">
        </div>
      </div>
    </section>

    <div style="padding: 0 24px 24px">
      <button class="button" id="applyButton">Применить настройки</button>
      <p class="status" id="status" role="status"></p>
    </div>
  </main>

  <script>
    const elements = {
      power: document.getElementById("powerButton"),
      brightness: document.getElementById("brightness"),
      brightnessValue: document.getElementById("brightnessValue"),
      mode: document.getElementById("mode"),
      fadeMs: document.getElementById("fadeMs"),
      pauseMs: document.getElementById("pauseMs"),
      lower: document.getElementById("lowerBrightness"),
      lowerValue: document.getElementById("lowerValue"),
      lowerField: document.getElementById("lowerField"),
      animatedFields: document.getElementById("animatedFields"),
      constantHint: document.getElementById("constantHint"),
      apply: document.getElementById("applyButton"),
      status: document.getElementById("status")
    };

    let confirmedPower = false;
    let formDirty = false;
    let refreshRunning = false;
    let profiles = null;

    function profileKey(mode) {
      return {2: "fade", 3: "alternate", 4: "half_alternate"}[mode] || null;
    }

    function showStatus(message, className = "") {
      elements.status.textContent = message;
      elements.status.className = `status ${className}`;
    }

    function updatePowerButton() {
      elements.power.textContent = confirmedPower ? "Выключить" : "Включить";
    }

    function updateProfileFields() {
      const mode = Number(elements.mode.value);
      const key = profileKey(mode);
      elements.constantHint.classList.toggle("hidden", Boolean(key));
      elements.animatedFields.classList.toggle("hidden", !key);
      elements.lowerField.classList.toggle("hidden", mode !== 4);
      if (!key || !profiles) return;

      const profile = profiles[key];
      elements.fadeMs.value = profile.fade_ms;
      elements.pauseMs.value = profile.pause_ms;
      if (mode === 4) {
        elements.lower.value = profile.lower_brightness;
        elements.lowerValue.textContent = profile.lower_brightness;
      }
    }

    function markDirty() {
      formDirty = true;
      showStatus("Есть неприменённые изменения", "dirty");
    }

    function saveVisibleProfileDraft() {
      const mode = Number(elements.mode.value);
      const key = profileKey(mode);
      if (!key || !profiles) return;

      profiles[key].fade_ms = Number(elements.fadeMs.value);
      profiles[key].pause_ms = Number(elements.pauseMs.value);
      if (mode === 4) {
        profiles[key].lower_brightness = Number(elements.lower.value);
      }
    }

    async function requestJson(url, options = {}) {
      const response = await fetch(url, options);
      const payload = await response.json().catch(() => ({}));
      if (!response.ok) {
        throw new Error(payload.error || `HTTP ${response.status}`);
      }
      return payload;
    }

    async function refreshState(forceFormUpdate = false) {
      if (refreshRunning) return;
      refreshRunning = true;
      try {
        const [state, serverProfiles] = await Promise.all([
          requestJson("/api/state"),
          requestJson("/api/profiles")
        ]);
        confirmedPower = state.power;
        updatePowerButton();

        if (!formDirty || forceFormUpdate) {
          profiles = serverProfiles;
          elements.brightness.value = state.brightness;
          elements.brightnessValue.textContent = state.brightness;
          elements.mode.value = String(state.mode);
          updateProfileFields();
          formDirty = false;
          showStatus(`Состояние подтверждено, revision ${state.revision}`);
        }
      } catch (error) {
        console.error("Не удалось обновить состояние:", error);
        showStatus(`Ошибка связи: ${error.message}`, "error");
      } finally {
        refreshRunning = false;
      }
    }

    function buildSelectedProfile() {
      const mode = Number(elements.mode.value);
      if (mode === 1) return undefined;

      const profile = {
        fade_ms: Number(elements.fadeMs.value),
        pause_ms: Number(elements.pauseMs.value)
      };
      if (mode === 4) {
        profile.lower_brightness = Number(elements.lower.value);
      }
      return profile;
    }

    document.querySelectorAll(".tab").forEach((tab) => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach((item) =>
          item.classList.toggle("active", item === tab));
        document.querySelectorAll(".panel").forEach((panel) =>
          panel.classList.toggle("active", panel.id === tab.dataset.panel));
      });
    });

    elements.brightness.addEventListener("input", () => {
      elements.brightnessValue.textContent = elements.brightness.value;
      markDirty();
    });
    elements.mode.addEventListener("change", () => {
      updateProfileFields();
      markDirty();
    });
    [elements.fadeMs, elements.pauseMs].forEach((input) =>
      input.addEventListener("input", () => {
        saveVisibleProfileDraft();
        markDirty();
      }));
    elements.lower.addEventListener("input", () => {
      elements.lowerValue.textContent = elements.lower.value;
      saveVisibleProfileDraft();
      markDirty();
    });

    elements.power.addEventListener("click", async () => {
      elements.power.disabled = true;
      try {
        await requestJson("/api/state", {
          method: "PUT",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({power: !confirmedPower})
        });
        await refreshState();
      } catch (error) {
        showStatus(`Питание не изменено: ${error.message}`, "error");
      } finally {
        elements.power.disabled = false;
      }
    });

    elements.apply.addEventListener("click", async () => {
      elements.apply.disabled = true;
      showStatus("Проверка и применение…");
      const command = {
        brightness: Number(elements.brightness.value),
        mode: Number(elements.mode.value)
      };
      const profile = buildSelectedProfile();
      if (profile) command.profile = profile;

      try {
        await requestJson("/api/state", {
          method: "PUT",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify(command)
        });
        /*
         * A successful PUT means the server committed the candidate. Clearing
         * dirty here also makes the next polling cycle authoritative if a
         * concurrent refresh is already in progress.
         */
        formDirty = false;
        await refreshState(true);
      } catch (error) {
        showStatus(`Настройки не применены: ${error.message}`, "error");
      } finally {
        elements.apply.disabled = false;
      }
    });

    refreshState(true);
    window.setInterval(() => refreshState(false), 1000);
  </script>
</body>
</html>
