; PlatformIO configuration for the ESP-IDF build.
;
; Both the Espressif32 integration and ESP-IDF itself are pinned. This makes
; builds reproducible: a future PlatformIO update must not silently change the
; SDK or toolchain used by the firmware.

[platformio]
default_envs = esp32dev

; ESP-IDF normally calls the application component "main". PlatformIO uses
; "src" by default, so we explicitly preserve the existing project layout.
src_dir = main

[env:esp32dev]
platform = platformio/espressif32@6.5.0
framework = espidf
board = esp32dev

; PlatformIO otherwise creates and prefers sdkconfig.<environment>. Point it at
; the existing native ESP-IDF configuration so hardware and Wi-Fi settings are
; migrated instead of silently reverting to Kconfig example defaults.
board_build.esp-idf.sdkconfig_path = sdkconfig

; PlatformIO's official package 3.50102.240122 contains ESP-IDF 5.1.2. It is
; explicitly pinned because a raw ESP-IDF Git checkout is not a valid
; PlatformIO framework package. The former native project used the v5.1 tag;
; 5.1.2 is a patch-level update on the same API/toolchain generation.
platform_packages =
    framework-espidf @ 3.50102.240122

; Match the hardware settings already stored in sdkconfig. The generic
; esp32dev board manifest assumes 4 MB, while this controller uses 2 MB flash.
board_upload.flash_size = 2MB
board_upload.maximum_size = 2097152
board_build.partitions = partitions.csv

; PlatformIO first converts this file into an assembly object. The root
; CMakeLists.txt then attaches that generated object to the ESP-IDF ELF target.
board_build.embed_files = main/www/index.html.gz

; ESP-IDF's default console baud rate in the current sdkconfig is 115200.
monitor_speed = 115200
